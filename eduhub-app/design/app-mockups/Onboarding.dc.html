<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First-launch tour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #fbf3ee; color: #2a0a18; font-family: 'Poppins', sans-serif">

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 46px; height: 46px; border-radius: 50%; background: #f3dde5; color: #6b1535; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; flex: none">AK</div>
      <div style="flex: 1; min-width: 0; line-height: 1.3">
        <div style="font-size: 12.5px; color: #755a64">Good morning,</div>
        <div style="font-size: 17px; font-weight: 600">Aisha</div>
      </div>
      <div style="position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ebdcd8; background: #fff; color: #2a0a18; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z M10 20.5a2 2 0 0 0 4 0"/></svg>
        <span style="position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: #c99c3a; color: #2a0a18; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ebdcd8; background: #fff; color: #2a0a18; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 13a7.9 7.9 0 0 0 0-2l2-1.5-2-3.5-2.3.9a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.4a7.6 7.6 0 0 0-1.7 1l-2.3-.9-2 3.5 2 1.5a7.9 7.9 0 0 0 0 2l-2 1.5 2 3.5 2.3-.9a7.6 7.6 0 0 0 1.7 1l.4 2.4h4l.4-2.4a7.6 7.6 0 0 0 1.7-1l2.3.9 2-3.5z"/></svg>
      </div>
    </div>

    <div style="border-radius: 24px; padding: 18px; background: linear-gradient(135deg, #6b1535, #3a0a1e); color: #fff; display: flex; align-items: center; gap: 14px; height: 150px; box-sizing: border-box">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85">Your application · 3 things left</div>
        <div style="font-size: 17px; font-weight: 600; line-height: 1.3">Upload the father's passport</div>
        <div style="font-size: 12.5px; line-height: 1.4; opacity: 0.88">Then: Amina's birth certificate and Omar's photo</div>
      </div>
      <div style="width: 68px; height: 68px; border-radius: 50%; border: 7px solid #e8c26a; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: none">78%</div>
    </div>

    <div style="background: #fff; border: 1px solid #ebdcd8; border-radius: 24px; padding: 16px 12px 8px; height: 250px; box-sizing: border-box">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px 14px">
        <div style="font-size: 16px; font-weight: 600">Your schools</div>
        <div style="font-size: 13px; font-weight: 600; color: #6b1535">See all ›</div>
      </div>
      <div style="position: relative; display: flex">
        <div style="position: absolute; left: calc(100% / 14); right: calc(100% / 14); top: 18px; height: 3px; border-radius: 2px; background: #ebdcd8"></div>
        <div style="position: absolute; left: calc(100% / 14); top: 18px; height: 3px; border-radius: 2px; background: #6b1535; width: calc((100% - 100% / 7) * 0.1667)"></div>
        <sc-for list="{{stages}}" as="s" hint-placeholder-count="7">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative">
            <div style="{{s.nodeStyle}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"/></svg>
              <sc-if value="{{s.hasCount}}" hint-placeholder-val="{{ true }}">
                <span style="position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: #c99c3a; color: #2a0a18; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.n}}</span>
              </sc-if>
            </div>
            <div style="{{s.labelStyle}}">{{s.label}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #fff; border-top: 1px solid #ebdcd8; display: flex; padding: 8px 6px 0; box-sizing: border-box">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <div style="{{tab.pillStyle}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.d}}"/></svg>
        </div>
        <div style="{{tab.labelStyle}}">{{tab.label}}</div>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
    <div style="{{overlayStyle}}"></div>
    <div style="{{spotStyle}}"></div>
    <div style="{{cardStyle}}">
      <sc-if value="{{showDots}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; gap: 6px; align-items: center">
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
            <div style="{{d.style}}"></div>
          </sc-for>
          <div style="margin-left: auto; font-size: 12px; color: #755a64">{{stepLabel}}</div>
        </div>
      </sc-if>
      <div style="font-size: 18px; font-weight: 700; line-height: 1.3">{{title}}</div>
      <div style="font-size: 14px; line-height: 1.5; color: #5a4249">{{body}}</div>
      <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px">
        <sc-if value="{{showSkip}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{skip}}" style="height: 46px; padding: 0 16px; border-radius: 23px; border: 0; background: transparent; color: #755a64; font-size: 14.5px; font-weight: 600">Skip</button>
        </sc-if>
        <button onClick="{{next}}" style="flex: 1; height: 46px; border-radius: 23px; border: 0; background: #5a0f2b; color: #fff; font-size: 15px; font-weight: 600">{{nextLabel}}</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{finished}}" hint-placeholder-val="{{ false }}">
    <button onClick="{{replay}}" style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 104px; height: 44px; padding: 0 20px; border-radius: 22px; border: 1.5px solid #6b1535; background: #fff; color: #6b1535; font-size: 14px; font-weight: 600; box-shadow: 0 6px 18px rgba(80,20,40,0.15)">Replay the tour</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const step = (this.state && this.state.step !== undefined) ? this.state.step : 0;
    const running = step <= 6;

    const STEPS = [
      { title:'Welcome to Heather Harries', body:'A quick tour so you know where everything is. It takes less than a minute, and you can skip it any time.', next:'Take the tour', spot:null, tip:300 },
      { title:'This is you', body:'Tap your photo to open your profile and family details.', next:'Next', spot:{x:12,y:10,w:200,h:62,r:31}, tip:92 },
      { title:'Alerts and settings', body:'The bell shows tour times, gates and updates from your consultant. The gear holds settings, appearance and notifications.', next:'Next', spot:{x:262,y:10,w:116,h:62,r:31}, tip:92 },
      { title:'What to do next', body:'This card always tells you the one thing to do next, and how complete your application is.', next:'Next', spot:{x:14,y:80,w:362,h:154,r:26}, tip:254 },
      { title:'Every school, one view', body:'See which stage each school is at, from shortlist to placed. The gold numbers count the schools at that stage.', next:'Next', spot:{x:14,y:252,w:362,h:254,r:26}, tip:524 },
      { title:'Everything else, one tap away', body:'Application, Schools, Documents and Billing live here. Your application saves automatically.', next:'Next', spot:{x:0,y:760,w:390,h:84,r:0}, tip:566 },
      { title:'You are all set', body:'You can replay this tour any time from Settings.', next:'Get started', spot:null, tip:300 }
    ];
    const cur = STEPS[Math.min(step, 6)];
    const sp = cur.spot;

    const overlayStyle = `position:absolute;inset:0;background:${sp ? 'transparent' : 'rgba(20,5,12,0.74)'};`;
    const spotStyle = sp
      ? `position:absolute;left:${sp.x}px;top:${sp.y}px;width:${sp.w}px;height:${sp.h}px;border-radius:${sp.r}px;box-shadow:0 0 0 1200px rgba(20,5,12,0.74);border:2px solid #e8c26a;box-sizing:border-box;pointer-events:none;`
      : 'display:none;';
    const cardStyle = `position:absolute;left:20px;top:${cur.tip}px;width:350px;box-sizing:border-box;background:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px rgba(20,5,12,0.35);`;

    const dots = [1,2,3,4,5].map((n) => ({ style: `width:${n === step ? 20 : 7}px;height:7px;border-radius:4px;background:${n === step ? '#6b1535' : '#e3d2cd'};` }));

    const defs = [
      { label:'Shortlist', n:3, d:'M6 4h12v17l-6-4-6 4z' },
      { label:'Tours', n:2, d:'M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z M12 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z' },
      { label:'Apply', n:1, d:'M9 4h6v3H9z M7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1 M9 12h6 M9 16h6' },
      { label:'Fee', n:0, d:'M3.5 6.5h17v11h-17z M3.5 10.5h17 M6.5 14.5h3' },
      { label:'Assess.', n:0, d:'M6 3.5h9l4 4V20.5H6z M9 13l2 2 4-4' },
      { label:'Outcome', n:0, d:'M6 21V4 M6 5h11l-2 4 2 4H6' },
      { label:'Placed', n:0, d:'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17z M8.5 12.2l2.4 2.4 4.6-4.8' }
    ];
    const stages = defs.map((s, i) => {
      const done = i < 1, on = i === 1;
      return {
        label: s.label, n: s.n, d: s.d, hasCount: s.n > 0,
        nodeStyle: `position:relative;width:38px;height:38px;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:${done ? '#6b1535' : on ? '#f3dde5' : '#f6eae6'};color:${done ? '#fff' : on ? '#6b1535' : '#755a64'};border:${on ? 2 : 1}px solid ${done || on ? '#6b1535' : '#ebdcd8'};`,
        labelStyle: `font-size:11px;line-height:1.2;text-align:center;color:${on ? '#2a0a18' : '#755a64'};font-weight:${on ? 600 : 500};`
      };
    });
    const tabDefs = [
      { label:'Home', d:'M4 4h6.5v6.5H4z M13.5 4H20v6.5h-6.5z M4 13.5h6.5V20H4z M13.5 13.5H20V20h-6.5z' },
      { label:'Application', d:'M9 4h6v3H9z M7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1 M9 12h6 M9 16h6' },
      { label:'Schools', d:'M2.5 9.5L12 5l9.5 4.5L12 14z M6 11.8V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.2' },
      { label:'Documents', d:'M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9.5V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z' },
      { label:'Billing', d:'M3.5 7.5h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z M3.5 7.5l11-3.5v3.5 M16 14h2' }
    ];
    const tabs = tabDefs.map((t, i) => ({
      label: t.label, d: t.d,
      pillStyle: `width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:${i === 0 ? '#f3dde5' : 'transparent'};color:${i === 0 ? '#6b1535' : '#755a64'};`,
      labelStyle: `font-size:11px;font-weight:${i === 0 ? 600 : 500};color:${i === 0 ? '#6b1535' : '#755a64'};`
    }));

    return {
      running, finished: !running,
      overlayStyle, spotStyle, cardStyle, dots,
      showDots: step >= 1 && step <= 5,
      stepLabel: `${step} of 5`,
      title: cur.title, body: cur.body, nextLabel: cur.next,
      showSkip: step <= 5,
      next: () => this.setState({ step: step + 1 }),
      skip: () => this.setState({ step: 7 }),
      replay: () => this.setState({ step: 0 }),
      stages, tabs
    };
  }
}
</script>
</body>
</html>
