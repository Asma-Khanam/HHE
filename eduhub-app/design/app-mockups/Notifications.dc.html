<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #fbf3ee; color: #2a0a18; font-family: 'Poppins', sans-serif">
  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; gap: 10px">
      <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ebdcd8; background: #fff; color: #2a0a18; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <h1 style="margin: 0; flex: 1; font-size: 22px; font-weight: 700">Notifications</h1>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #ebdcd8; background: #fff; color: #6b1535; font-size: 12.5px; font-weight: 600">Mark all read</button>
    </div>

    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #755a64; margin: 4px 4px -4px">New</div>

    <div style="background: #fff; border: 1px solid #6b1535; border-radius: 20px; box-shadow: 0 6px 18px rgba(80,20,40,0.07); overflow: hidden">
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px">
        <div style="width: 58px; height: 68px; border-radius: 16px; background: #f3dde5; color: #6b1535; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; flex: none">
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em">OCT</div>
          <div style="font-size: 25px; font-weight: 800">28</div>
          <div style="font-size: 11px">Wed</div>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #e3f1e7; color: #1f6b3a">Tour booked</span>
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #5a0f2b"></span>
            <span style="margin-left: auto; font-size: 11.5px; color: #755a64">Just now</span>
          </div>
          <div style="font-size: 15.5px; font-weight: 700; line-height: 1.25">Al Mawakeb School – Al Barsha</div>
          <div style="font-size: 13.5px; color: #755a64">12:24 am – 1:28 am</div>
        </div>
      </div>
      <div style="margin: 0 14px 14px; padding: 12px 14px; border-radius: 14px; background: #f6eae6; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{details}}" as="d" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: 88px 1fr; gap: 10px; align-items: start">
            <div style="font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #755a64; padding-top: 2px">{{d.k}}</div>
            <div style="font-size: 14px">{{d.v}}</div>
          </div>
        </sc-for>
        <button style="align-self: flex-start; height: 40px; padding: 0 18px; border-radius: 20px; border: 0; background: #5a0f2b; color: #fff; font-size: 13.5px; font-weight: 600">Open in Maps</button>
      </div>
    </div>

    <div style="background: #fff; border: 1px solid #6b1535; border-radius: 20px; box-shadow: 0 6px 18px rgba(80,20,40,0.07); display: flex; align-items: center; gap: 14px; padding: 14px">
      <div style="width: 58px; height: 58px; border-radius: 16px; background: #f3dde5; color: #6b1535; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z M7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1 M9 12h6 M9 16h6"/></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #f3dde5; color: #6b1535">Application sent</span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #5a0f2b"></span>
          <span style="margin-left: auto; font-size: 11.5px; color: #755a64">2 h ago</span>
        </div>
        <div style="font-size: 15.5px; font-weight: 700; line-height: 1.25">Dubai British School</div>
        <div style="font-size: 13.5px; color: #755a64">Your application has been submitted.</div>
      </div>
    </div>

    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #755a64; margin: 4px 4px -4px">Earlier</div>

    <div style="background: #fff; border: 1px solid #ebdcd8; border-radius: 20px; display: flex; align-items: center; gap: 14px; padding: 14px">
      <div style="width: 58px; height: 58px; border-radius: 16px; background: #f6eae6; color: #755a64; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #f6eae6; color: #755a64">Shortlisted</span>
          <span style="margin-left: auto; font-size: 11.5px; color: #755a64">Mon</span>
        </div>
        <div style="font-size: 15.5px; font-weight: 700; line-height: 1.25">Swiss International Scientific School</div>
        <div style="font-size: 13.5px; color: #755a64">Added to your shortlist.</div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #fff; border-top: 1px solid #ebdcd8; display: flex; padding: 8px 6px 0; box-sizing: border-box">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <div style="width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #755a64">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.d}}"/></svg>
        </div>
        <div style="font-size: 11px; font-weight: 500; color: #755a64">{{tab.label}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const details = [
      { k:'Arrival', v:'Please arrive 10 minutes early' },
      { k:'Gate', v:'Gate 2' },
      { k:'Parking', v:'Visitor parking, left of the main entrance' },
      { k:'Ask for', v:'Reception, admissions desk' },
      { k:'Bring', v:'Passport / Emirates ID' }
    ];
    const tabs = [
      { label:'Home', d:'M4 4h6.5v6.5H4z M13.5 4H20v6.5h-6.5z M4 13.5h6.5V20H4z M13.5 13.5H20V20h-6.5z' },
      { label:'Application', d:'M9 4h6v3H9z M7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1 M9 12h6 M9 16h6' },
      { label:'Schools', d:'M2.5 9.5L12 5l9.5 4.5L12 14z M6 11.8V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.2' },
      { label:'Documents', d:'M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9.5V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z' },
      { label:'Billing', d:'M3.5 7.5h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z M3.5 7.5l11-3.5v3.5 M16 14h2' }
    ];
    return { details, tabs };
  }
}
</script>
</body>
</html>
