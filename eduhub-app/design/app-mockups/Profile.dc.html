<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #fbf3ee; color: #2a0a18; font-family: 'Poppins', sans-serif">
  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; gap: 10px">
      <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ebdcd8; background: #fff; color: #2a0a18; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">Your family</h1>
    </div>

    <div style="background: #fff; border: 1px solid #ebdcd8; border-radius: 24px; padding: 8px 14px; box-shadow: 0 6px 18px rgba(80,20,40,0.07)">
      <sc-for list="{{members}}" as="m" hint-placeholder-count="4">
        <div style="{{m.rowStyle}}">
          <div style="{{m.avatarStyle}}">{{m.initial}}</div>
          <div style="flex: 1; min-width: 0; line-height: 1.3">
            <div style="font-size: 15px; font-weight: 600">{{m.name}}</div>
            <div style="font-size: 12.5px; color: #755a64">{{m.sub}}</div>
          </div>
          <div style="font-size: 12.5px; font-weight: 600; color: #6b1535">Photo</div>
        </div>
      </sc-for>
    </div>

    <div style="background: #fff; border: 1px solid #ebdcd8; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 18px rgba(80,20,40,0.07)">
      <div style="font-size: 16px; font-weight: 600">Your package</div>
      <div style="display: flex; gap: 12px">
        <div style="flex: 1; border-radius: 16px; background: #f6eae6; padding: 12px; display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 12px; color: #755a64">School tours</div>
          <div style="font-size: 22px; font-weight: 700">3 <span style="font-size: 13px; font-weight: 500; color: #755a64">of 3 used</span></div>
          <div style="display: flex; gap: 4px"><div style="flex: 1; height: 6px; border-radius: 3px; background: #6b1535"></div><div style="flex: 1; height: 6px; border-radius: 3px; background: #6b1535"></div><div style="flex: 1; height: 6px; border-radius: 3px; background: #6b1535"></div></div>
        </div>
        <div style="flex: 1; border-radius: 16px; background: #f6eae6; padding: 12px; display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 12px; color: #755a64">Applications</div>
          <div style="font-size: 22px; font-weight: 700">1 <span style="font-size: 13px; font-weight: 500; color: #755a64">of 3 used</span></div>
          <div style="display: flex; gap: 4px"><div style="flex: 1; height: 6px; border-radius: 3px; background: #6b1535"></div><div style="flex: 1; height: 6px; border-radius: 3px; background: #ebdcd8"></div><div style="flex: 1; height: 6px; border-radius: 3px; background: #ebdcd8"></div></div>
        </div>
      </div>
    </div>

    <div style="background: #fff; border: 1px solid #ebdcd8; border-radius: 24px; padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 18px rgba(80,20,40,0.07)">
      <div style="width: 48px; height: 48px; border-radius: 50%; background: #e8dcc4; color: #5a4a1e; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; flex: none">C</div>
      <div style="flex: 1; min-width: 0; line-height: 1.3">
        <div style="font-size: 12px; color: #755a64">Your consultant</div>
        <div style="font-size: 15px; font-weight: 600">[Consultant name]</div>
      </div>
      <button style="height: 40px; padding: 0 18px; border-radius: 20px; border: 0; background: #5a0f2b; color: #fff; font-size: 13.5px; font-weight: 600">Message</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #fff; border-top: 1px solid #ebdcd8; display: flex; padding: 8px 6px 0; box-sizing: border-box">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <div style="width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #755a64">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.d}}"/></svg>
        </div>
        <div style="font-size: 11px; font-weight: 500; color: #755a64">{{tab.label}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const M = (name, sub, initial, bg, fg, i) => ({
      name, sub, initial,
      avatarStyle: `width:46px;height:46px;border-radius:50%;background:${bg};color:${fg};font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none;`,
      rowStyle: `display:flex;align-items:center;gap:12px;min-height:64px;${i > 0 ? 'border-top:1px solid #f0e4e0;' : ''}`
    });
    const members = [
      M('Aisha Khan', 'Mother · you', 'AK', '#f3dde5', '#6b1535', 0),
      M('Father', 'Father', 'F', '#f3dde5', '#6b1535', 1),
      M('Amina', 'Child · Year 4', 'A', '#f3dde5', '#6b1535', 2),
      M('Omar', 'Child · Year 1', 'O', '#e8dcc4', '#5a4a1e', 3)
    ];
    const tabs = [
      { label:'Home', d:'M4 4h6.5v6.5H4z M13.5 4H20v6.5h-6.5z M4 13.5h6.5V20H4z M13.5 13.5H20V20h-6.5z' },
      { label:'Application', d:'M9 4h6v3H9z M7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1 M9 12h6 M9 16h6' },
      { label:'Schools', d:'M2.5 9.5L12 5l9.5 4.5L12 14z M6 11.8V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.2' },
      { label:'Documents', d:'M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9.5V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z' },
      { label:'Billing', d:'M3.5 7.5h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z M3.5 7.5l11-3.5v3.5 M16 14h2' }
    ];
    return { members, tabs };
  }
}
</script>
</body>
</html>
