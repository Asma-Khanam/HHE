<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Application</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1120px; position: relative; overflow: hidden; box-sizing: border-box; background: #fbf3ee; color: #2a0a18; font-family: 'Poppins', sans-serif">
  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">Application</h1>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #1f6b3a; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Saved
      </div>
    </div>

    <div style="border-radius: 24px; padding: 18px; background: linear-gradient(135deg, #6b1535, #3a0a1e); color: #fff; display: flex; align-items: center; gap: 14px">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 17px; font-weight: 600; line-height: 1.3">78% complete</div>
        <div style="font-size: 13px; line-height: 1.45; opacity: 0.9">Everything saves as you type. There is nothing to submit; we see it as soon as it is complete.</div>
      </div>
      <div style="position: relative; width: 68px; height: 68px; flex: none">
        <svg width="68" height="68" viewBox="0 0 68 68" aria-hidden="true"><circle cx="34" cy="34" r="28" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="7"/><circle cx="34" cy="34" r="28" fill="none" stroke="#e8c26a" stroke-width="7" stroke-linecap="round" stroke-dasharray="137 176" transform="rotate(-90 34 34)"/></svg>
      </div>
    </div>

    <div style="background: #fff; border: 1px solid #ebdcd8; border-radius: 22px; overflow: hidden; box-shadow: 0 6px 18px rgba(80,20,40,0.07)">
      <sc-for list="{{sections}}" as="s" hint-placeholder-count="6">
        <div style="{{s.rowStyle}}">
          <div style="{{s.iconStyle}}">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"/></svg>
          </div>
          <div style="flex: 1; min-width: 0; line-height: 1.3">
            <div style="font-size: 14.5px; font-weight: 600">{{s.title}}</div>
            <div style="font-size: 12.5px; color: #755a64">{{s.sub}}</div>
          </div>
          <div style="{{s.chipStyle}}">{{s.chip}}</div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#755a64" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </sc-for>
    </div>

    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #755a64; margin: 4px 4px -6px">Amina · 4 fields left</div>
    <div style="background: #fff; border: 1px solid #6b1535; border-radius: 22px; padding: 6px 14px; box-shadow: 0 6px 18px rgba(80,20,40,0.07)">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="5">
        <div style="{{f.rowStyle}}">
          <div style="font-size: 12px; color: #755a64">{{f.label}}</div>
          <div style="{{f.valueStyle}}">{{f.value}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #fff; border-top: 1px solid #ebdcd8; display: flex; padding: 8px 6px 0; box-sizing: border-box">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <div style="{{tab.pillStyle}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.d}}"/></svg>
        </div>
        <div style="{{tab.labelStyle}}">{{tab.label}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const user = 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5';
    const family = 'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M16.5 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z M2.5 19c.5-3 2.7-4.5 5.5-4.5S13 16 13.5 19 M14.5 15c2-.3 5.5.2 6 4';
    const home = 'M4 11l8-6.5 8 6.5 M6 10v9h12v-9 M10 19v-5h4v5';
    const heart = 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z';
    const cap = 'M2.5 9.5L12 5l9.5 4.5L12 14z M6 11.8V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.2';
    const defs = [
      { title:'Father', sub:'Contact and work details', d:user, done:true },
      { title:'Mother', sub:'Contact and work details', d:user, done:true },
      { title:'Amina', sub:'Child · Year 4', d:family, chip:'4 left' },
      { title:'Omar', sub:'Child · Year 1', d:family, chip:'2 left' },
      { title:'Home address', sub:'Where you live in Dubai', d:home, done:true },
      { title:'Health and learning needs', sub:'Optional, only if relevant', d:heart, done:true },
      { title:'School preferences', sub:'Areas, curriculum, start date', d:cap, chip:'1 left' }
    ];
    const sections = defs.map((s, i) => ({
      title: s.title, sub: s.sub, d: s.d, chip: s.done ? 'Complete' : s.chip,
      iconStyle: `width:38px;height:38px;border-radius:12px;background:${s.done ? '#e3f1e7' : '#f3dde5'};color:${s.done ? '#1f6b3a' : '#6b1535'};display:flex;align-items:center;justify-content:center;flex:none;`,
      chipStyle: `font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:${s.done ? '#e3f1e7' : '#f7ecd0'};color:${s.done ? '#1f6b3a' : '#6b4a0a'};`,
      rowStyle: `display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 14px;box-sizing:border-box;${i > 0 ? 'border-top:1px solid #f0e4e0;' : ''}`
    }));
    const F = (label, value, missing, i) => ({
      label, value: missing ? 'Add' : value,
      rowStyle: `display:flex;flex-direction:column;gap:4px;padding:11px 0;${i > 0 ? 'border-top:1px solid #f0e4e0;' : ''}`,
      valueStyle: missing
        ? 'font-size:14px;font-weight:600;color:#6b4a0a;background:#f7ecd0;border-radius:10px;padding:10px 12px;'
        : 'font-size:15px;'
    });
    const fields = [
      F('First name (as in passport)', 'Amina', false, 0),
      F('Date of birth', '14 March 2018', false, 1),
      F('Year applying for', 'Year 5', true, 2),
      F('First language', 'Arabic', false, 3),
      F('English level', '', true, 4)
    ];
    const tabDefs = [
      { label:'Home', d:'M4 4h6.5v6.5H4z M13.5 4H20v6.5h-6.5z M4 13.5h6.5V20H4z M13.5 13.5H20V20h-6.5z' },
      { label:'Application', d:'M9 4h6v3H9z M7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1 M9 12h6 M9 16h6' },
      { label:'Schools', d:'M2.5 9.5L12 5l9.5 4.5L12 14z M6 11.8V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.2' },
      { label:'Documents', d:'M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9.5V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z' },
      { label:'Billing', d:'M3.5 7.5h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z M3.5 7.5l11-3.5v3.5 M16 14h2' }
    ];
    const tabs = tabDefs.map((t, i) => ({
      label: t.label, d: t.d,
      pillStyle: `width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:${i === 1 ? '#f3dde5' : 'transparent'};color:${i === 1 ? '#6b1535' : '#755a64'};`,
      labelStyle: `font-size:11px;font-weight:${i === 1 ? 600 : 500};color:${i === 1 ? '#6b1535' : '#755a64'};`
    }));
    return { sections, fields, tabs };
  }
}
</script>
</body>
</html>
